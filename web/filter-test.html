<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prueba del filtro (solo pruebas)</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 1rem auto; padding: 0 1rem; }
      #stage { position: relative; }
      video, canvas { width: 100%; display: block; }
      video { transform: scaleX(-1); background: #111; border-radius: 8px; }
      canvas { position: absolute; inset: 0; height: 100%; pointer-events: none; }
      #error { color: #b00020; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>Prueba del filtro de Spider-Man</h1>
    <p id="error" role="alert"></p>
    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="filter"></canvas>
    </div>
    <script type="module" src="/src/dev/filterTest.ts"></script>
  </body>
</html>
